services:
  webserver56:
    environment:
      VIRTUAL_HOST: php56.wsdd.dock,cron56.wsdd.dock,wm56.wsdd.dock,phpadmin56.wsdd.dock
      VIRTUAL_PORT: 80
      WSDD_PHP_ADMIN_APACHE_PROBE_HOST: phpadmin-runtime.internal
      CLIENT_MAX_BODY_SIZE: 16m
    volumes:
      - ./dev:/var/www/html/dev
      - ./vhost:/etc/apache2/sites-enabled
      - ./php.ini:/usr/local/etc/php/php.ini
      - ./cron:/etc/cron-task
      - ./log/apache2:/var/log/apache2
      - ./log/cron:/var/log/cron
      - ../../state/php-admin/php56:/var/lib/wsdd-php-admin
      - ../../log/php-admin/php56:/var/log/wsdd-php-admin
