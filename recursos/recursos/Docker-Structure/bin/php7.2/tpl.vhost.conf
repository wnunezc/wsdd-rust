<VirtualHost *:80>
    ServerName {CustomUrl}
    DocumentRoot /var/www/html/{CustomUrl}{EntryPoint}
	{PROTOCOL}
    <Directory /var/www/html/{CustomUrl}>
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride All
        Require all granted
		Allow from all
    </Directory>

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/ws$ ws://127.0.0.1:8080/ [P,L]

    ProxyPass        /ws ws://127.0.0.1:8080/
    ProxyPassReverse /ws ws://127.0.0.1:8080/

    ErrorLog /var/www/html/log/{CustomUrl}_error.log
    CustomLog /var/www/html/log/{CustomUrl}_access.log combined
</VirtualHost>