services:
  webserver72:
    container_name: WSDD-Web-Server-PHP7.2
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WEBMIN_USER: __WSDD_WEBMIN_USER__
        WEBMIN_PASS: __WSDD_WEBMIN_PASS__
        XDEBUG_ENABLED: __WSDD_XDEBUG_ENABLED__
    restart: always
    expose:
      - "80"   # Exposes Web Server (Apache)
      - "9000" # Exposes xDebug
      - "10000" # Exposes Webmin
    networks:
      - wsdd-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../ssl/wsdd-mkcert-rootCA.crt:/usr/local/share/ca-certificates/wsdd-mkcert-rootCA.crt:ro
    labels:
      - "wsdd.webserver.description=Web Server php7.2"
      - "wsdd.webserver.role=webserver"
    privileged: true
    tty: true

networks:
  wsdd-network:
    external: true
