# Managed by WSDD. Keep the root selection aligned with the container CMD.
<VirtualHost *:80>
    ServerName phpadmin-runtime.internal
    DocumentRoot /opt/wsdd-php-admin/public
    RewriteEngine On
    RewriteRule !^/runtime-probe[.]php$ - [F]
    RewriteCond /var/www/html/phpadmin72.dock/bin/wsdd-php-admin -x
    RewriteRule ^/runtime-probe[.]php$ /var/www/html/phpadmin72.dock/public/runtime-probe.php [END]
    RewriteCond /opt/wsdd-php-admin/bin/wsdd-php-admin -x
    RewriteRule ^/runtime-probe[.]php$ /opt/wsdd-php-admin/public/runtime-probe.php [END]
    RewriteRule ^ - [F]
    <Directory /opt/wsdd-php-admin/public>
        Options -Indexes
        AllowOverride None
        Require local
    </Directory>
    <Directory /var/www/html/phpadmin72.dock/public>
        Options -Indexes
        AllowOverride None
        Require local
    </Directory>
    ErrorLog /var/log/wsdd-php-admin/phpadmin-runtime.internal_error.log
    CustomLog /var/log/wsdd-php-admin/phpadmin-runtime.internal_access.log combined
</VirtualHost>
