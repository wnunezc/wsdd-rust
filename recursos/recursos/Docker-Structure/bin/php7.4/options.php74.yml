services:
  webserver74:
    environment:
      VIRTUAL_HOST: php74.wsdd.dock,cron74.wsdd.dock,wm74.wsdd.dock,phpadmin74.wsdd.dock
      VIRTUAL_PORT: 80
      CLIENT_MAX_BODY_SIZE: 16m
    volumes:
      - ./dev:/var/www/html/dev
      - ./vhost:/etc/apache2/sites-enabled
      - ./php.ini:/usr/local/etc/php/php.ini
      - ./cron:/etc/cron-task
      - ./log/apache2:/var/log/apache2
      - ./log/cron:/var/log/cron
      - ../../state/php-admin/php74:/var/lib/wsdd-php-admin
      - ../../log/php-admin/php74:/var/log/wsdd-php-admin