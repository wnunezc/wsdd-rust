services:
  webserver84:
    container_name: WSDD-Web-Server-PHP8.4
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WEBMIN_USER: __WSDD_WEBMIN_USER__
        WEBMIN_PASS: __WSDD_WEBMIN_PASS__
        XDEBUG_ENABLED: __WSDD_XDEBUG_ENABLED__
    restart: always
    mem_limit: 1g
    memswap_limit: 1536m
    cpus: 1.00
    expose:
      - "80"   # Exposes Web Server (Apache)
      - "9003" # Exposes xDebug
      - "10000" # Exposes Webmin
      - "8989" # Exposes WSDD-PHP-Admin
    networks:
      - wsdd-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../ssl/wsdd-mkcert-rootCA.crt:/usr/local/share/ca-certificates/wsdd-mkcert-rootCA.crt:ro
    labels:
      - "wsdd.webserver.description=Web Server php8.4"
      - "wsdd.webserver.role=webserver"
    privileged: true
    tty: true

networks:
  wsdd-network:
    external: true
