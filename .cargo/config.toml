[alias]
wix-msi = "run -p xtask -- wix-msi"

[build]
# Target principal: Windows x64
target = "x86_64-pc-windows-msvc"
target-dir = "D:/OpsZone/DevWorkspace/Engines/Rust-Resource/cargo-targets/WSDD"

[target.x86_64-pc-windows-msvc]
# Linker por defecto para MSVC
rustflags = ["-C", "target-feature=+crt-static"]
